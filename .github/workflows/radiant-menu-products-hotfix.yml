name: Radiant storefront hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/radiant-menu-products-hotfix.yml

permissions:
  contents: write

jobs:
  update-storefront:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update navigation and active product rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main.tsx')
          text = path.read_text()

          old_nav = """const navItems: { label: string; path: Page }[] = [
  { label: 'Shop', path: '/shop' },
  { label: 'Drop 001', path: '/drop-001' },
  { label: 'Lookbook', path: '/lookbook' },
  { label: 'Our Story', path: '/about' },
  { label: 'Mission', path: '/mission' },
];

const footerItems: { label: string; path: Page }[] = [
  ...navItems,
  { label: 'Contact', path: '/contact' },
];"""

          new_nav = """const navItems: { label: string; path: Page }[] = [
  { label: 'Shop', path: '/shop' },
  { label: 'Our Story', path: '/about' },
  { label: 'Contact', path: '/contact' },
];

const footerItems: { label: string; path: Page }[] = [...navItems];"""

          if old_nav not in text:
              raise SystemExit('Navigation block not found; refusing unsafe edit')
          text = text.replace(old_nav, new_nav, 1)

          if 'products(first: 24)' not in text:
              raise SystemExit('Product query size not found')
          text = text.replace('products(first: 24)', 'products(first: 50)', 1)

          old_filter = 'const finalProducts = shopifyProducts.filter((product) => product.canCheckout || product.storefrontVariantId);'
          new_filter = 'const finalProducts = shopifyProducts;'
          if old_filter not in text:
              raise SystemExit('Checkout-only product filter not found')
          text = text.replace(old_filter, new_filter, 1)

          text = text.replace('Get Drop Alert', 'Contact')
          path.write_text(text)
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit storefront update
        run: |
          git config user.name "Radiant 34 Storefront Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/radiant-menu-products-hotfix.yml
          git add src/main.tsx
          git commit -m "Simplify menu and show active Shopify products"
          git push origin main
